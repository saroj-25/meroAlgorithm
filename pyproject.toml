[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algosathi"
version = "1.0.0"
description = "Reproduction of AlgoSathi: RAG for DSA learning in Romanized Nepali and English"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3",
    "matplotlib>=3.7", "plotly>=5.18", "PyYAML>=6.0", "tqdm>=4.66",
]

[project.optional-dependencies]
full = ["torch>=2.2", "sentence-transformers>=3.0", "faiss-cpu>=1.8",
        "bert-score>=0.3.13", "mlflow>=2.12", "statsmodels>=0.14", "openai>=1.30"]
app = ["streamlit>=1.32"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
